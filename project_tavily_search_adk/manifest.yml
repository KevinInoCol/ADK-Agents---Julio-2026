# ============================================================
# Cloud Run — Servicio del agente Tavily
# ============================================================
# Se aplica con:
#   gcloud run services replace project_tavily_search_adk/manifest.yml \
#     --region=us-central1 --project=datapath-kevin-inofuentecolque
#
# Las API keys NO viven aquí: se referencian desde Secret Manager
# con secretKeyRef. Ver DEPLOY.md para crear los secretos y dar permisos.
#
# OJO: 'services replace' es declarativo. Lo que no esté en este archivo
# se resetea al valor por defecto en cada aplicación.
# ============================================================

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: project-tavily-search-adk-service
  labels:
    created-by: adk
  annotations:
    # Permite tráfico desde internet. Usa 'internal' para restringirlo a la VPC.
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Escala a cero cuando nadie lo usa (no se paga en reposo).
        autoscaling.knative.dev/minScale: '0'
        # Techo de instancias: protege el presupuesto y la cuota de Tavily.
        autoscaling.knative.dev/maxScale: '3'
        # CPU extra durante el arranque: reduce el cold start del ADK.
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      # Si usas una service account dedicada en vez de la de Compute por
      # defecto, descomenta y ajusta (necesita roles/secretmanager.secretAccessor):
      # serviceAccountName: adk-tavily-runner@datapath-kevin-inofuentecolque.iam.gserviceaccount.com
      containers:
        - name: adk-agent
          # Imagen construida por el primer 'adk deploy cloud_run' (ver DEPLOY.md).
          # Para desplegar una versión concreta, cambia :latest por el tag/digest.
          image: us-central1-docker.pkg.dev/datapath-kevin-inofuentecolque/cloud-run-source-deploy/project-tavily-search-adk-service:latest
          ports:
            - name: http1
              containerPort: 8000
          env:
            # --- Modo Google AI Studio (API key), NO Vertex AI ---
            # El Dockerfile que genera el ADK trae GOOGLE_GENAI_USE_ENTERPRISE=1
            # hardcodeado, que fuerza modo Vertex. Lo sobreescribimos aquí.
            # Se declaran las dos variables porque ENTERPRISE es la nueva y
            # VERTEXAI la legacy: ENTERPRISE gana si ambas están presentes.
            - name: GOOGLE_GENAI_USE_ENTERPRISE
              value: 'FALSE'
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: 'FALSE'

            # --- Claves desde Secret Manager ---
            # 'name' es el ID del secreto; 'key' es la versión ('latest' toma
            # siempre la más reciente, útil para rotar sin redesplegar).
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_API_KEY
                  key: latest
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: TAVILY_API_KEY
                  key: latest
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
